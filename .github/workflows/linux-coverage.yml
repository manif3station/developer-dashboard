name: Linux amd64 / arm64 Test Coverage

# Called by the serial macOS -> Linux -> Windows coverage chain.
on:
  workflow_call:
    inputs:
      target:
        description: Native Linux architecture to test (amd64 or arm64).
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux-coverage:
    name: Four-metric coverage 100% (Linux ${{ inputs.target }}, prove -j 10)
    runs-on: ${{ inputs.target == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 270
    env:
      PERL_MM_USE_DEFAULT: '1'
      NONINTERACTIVE_TESTING: '1'
      PERL_EXTUTILS_AUTOINSTALL: --defaultdeps
    steps:
      # An unconditional check fails visibly on caller or input drift;
      # never skip the strict coverage job because of a job-level guard.
      - name: Verify coverage caller and target
        shell: bash
        env:
          DD_COVERAGE_WORKFLOW_NAME: ${{ github.workflow }}
          DD_COVERAGE_TARGET: ${{ inputs.target }}
        run: |
          if [[ "$GITHUB_REPOSITORY" != "manif3station/developer-dashboard" ||
                "$DD_COVERAGE_WORKFLOW_NAME" != "Five-platform 100% Test Coverage" ]]; then
            echo "::error::Linux coverage requires the five-platform orchestrator"
            exit 1
          fi
          case "$DD_COVERAGE_TARGET" in
            amd64|arm64) ;;
            *) echo "::error::Unsupported Linux coverage target"; exit 1 ;;
          esac

      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify native Linux architecture
        timeout-minutes: 2
        shell: bash
        run: |
          test "$(uname -s)" = Linux
          if [[ "${{ inputs.target }}" == amd64 ]]; then
            test "$(uname -m)" = x86_64
          else
            test "$(uname -m)" = aarch64
          fi

      - name: Install Linux Perl and XS build dependencies
        timeout-minutes: 20
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            perl libperl-dev cpanminus build-essential pkg-config \
            libexpat1-dev libssl-dev libxml2-dev zlib1g-dev

      - name: Set up Node for test suite
        timeout-minutes: 10
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install Perl dependencies
        timeout-minutes: 45
        shell: bash
        run: cpanm --installdeps --notest -L local .

      - name: Install Devel::Cover
        timeout-minutes: 35
        shell: bash
        run: cpanm --notest -L local Devel::Cover

      - name: Build native XS extension
        timeout-minutes: 20
        shell: bash
        run: |
          export PERL5LIB="$GITHUB_WORKSPACE/local/lib/perl5${PERL5LIB:+:$PERL5LIB}"
          perl Makefile.PL
          make

      - name: Require 100% four-metric coverage (10 workers)
        timeout-minutes: 105
        shell: bash
        run: |
          local_lib="$GITHUB_WORKSPACE/local/lib/perl5"
          arch="$(perl -MConfig -e 'print $Config{archname}')"
          # Instrument lib/ source, not the copied blib/lib modules.
          export PERL5LIB="$GITHUB_WORKSPACE/blib/arch:$local_lib:$local_lib/$arch${PERL5LIB:+:$PERL5LIB}"
          export PATH="$GITHUB_WORKSPACE/local/bin:$PATH"
          # Keep nested Bash commands on the interpreter used to build XS.
          perl_bin="$(dirname "$(command -v perl)")"
          printf 'export PATH=%s:$PATH\n' "$(printf '%q' "$perl_bin")" > "$RUNNER_TEMP/perl-ci-bashenv"
          export BASH_ENV="$RUNNER_TEMP/perl-ci-bashenv"
          # The gate runs prove -j 10 and requires statement, branch,
          # condition, and subroutine coverage all to equal 100%.
          timeout --signal=TERM --kill-after=30s 5400s perl script/coverage-gate --jobs 10
