name: Platform compatibility

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: platform-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perl-tests:
    name: Perl tests (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-latest
            expected-os: linux
            expected-arch: x64
            setup-perl: true
          - label: Linux arm64
            runner: ubuntu-24.04-arm
            expected-os: linux
            expected-arch: arm64
            setup-perl: true
          - label: macOS Intel x64
            runner: macos-26-intel
            expected-os: darwin
            expected-arch: x64
            setup-perl: true
          - label: macOS arm64
            runner: macos-26
            expected-os: darwin
            expected-arch: arm64
            setup-perl: true
          - label: Windows x64
            runner: windows-latest
            expected-os: MSWin32
            expected-arch: x64
            setup-perl: false
          - label: Windows arm64
            runner: windows-11-arm
            expected-os: MSWin32
            expected-arch: arm64
            setup-perl: false
    env:
      DD_EXPECTED_OS: ${{ matrix.expected-os }}
      DD_EXPECTED_ARCH: ${{ matrix.expected-arch }}
      PERL_MM_USE_DEFAULT: 1
      NONINTERACTIVE_TESTING: 1
      PERL_EXTUTILS_AUTOINSTALL: --defaultdeps
      DD_REQUIRE_NATIVE_WATCHER: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install supported Strawberry Perl on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = '5.42.3.1'
          $archive = Join-Path $env:RUNNER_TEMP "strawberry-perl-$version-64bit-portable.zip"
          $root = Join-Path $env:RUNNER_TEMP 'strawberry-perl-portable'
          $url = "https://github.com/StrawberryPerl/Perl-Dist-Strawberry/releases/download/SP_54231_64bit/strawberry-perl-5.42.3.1-64bit-portable.zip"
          $expectedSha256 = '6a081a811781c30aca51dbc036afd93092af91e3297901f02c17043795a10690'

          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha256 = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Strawberry Perl portable SHA256 mismatch: $actualSha256"
          }

          if (Test-Path $root) {
            Remove-Item -Recurse -Force $root
          }
          Expand-Archive -Path $archive -DestinationPath $root -Force

          $siteBin = Join-Path $root 'perl\site\bin'
          $perlBin = Join-Path $root 'perl\bin'
          $compilerBin = Join-Path $root 'c\bin'
          if (-not (Test-Path (Join-Path $perlBin 'perl.exe'))) {
            throw "Portable Strawberry Perl was not extracted at $perlBin"
          }

          $env:PATH = "$siteBin;$perlBin;$compilerBin;$env:PATH"
          "$siteBin" >> $env:GITHUB_PATH
          "$perlBin" >> $env:GITHUB_PATH
          "$compilerBin" >> $env:GITHUB_PATH

          perl -e 'die "Perl 5.38 or newer is required\n" if $] < 5.038; print "Perl $^V ready on Windows ARM64 host\n"'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Get-Command cpanm -ErrorAction SilentlyContinue)) {
            cpan App::cpanminus
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $perlArch = & perl -MConfig -e 'print $Config{archname}'
          Write-Host "Windows $env:RUNNER_ARCH host uses $perlArch from pinned Strawberry Perl."

      - name: Install native Linux system-menu build dependencies
        if: startsWith(matrix.label, 'Linux')
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libayatana-appindicator3-dev libgtk-3-dev pkg-config

      - name: Set up Perl
        if: matrix.setup-perl
        uses: shogo82148/actions-setup-perl@53e33bb27be492a926eee378e8a5f7ff6618b061  # v1.43.1
        with:
          perl-version: '5.44'
          multi-thread: true

      - name: Set up Node for property tests
        if: matrix.label == 'Linux x64'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Report Perl and operating-system architecture
        run: perl -V

      - name: Assert runner operating system and architecture
        run: >-
          perl -MConfig -e '$os = $^O; $machine = lc($ENV{RUNNER_ARCH} // q{}); $actual_arch = $machine =~ /arm64/ ? "arm64" : $machine =~ /x64/ ? "x64" : "unknown"; die "Expected $ENV{DD_EXPECTED_OS}/$ENV{DD_EXPECTED_ARCH}, got $os/$actual_arch ($machine; Perl $Config{archname})\n" if $os ne $ENV{DD_EXPECTED_OS} || $actual_arch ne $ENV{DD_EXPECTED_ARCH}; print "Verified runner $os/$actual_arch with Perl $Config{archname}\n"'

      - name: Prepare Homebrew OpenSSL 3 for macOS
        if: startsWith(matrix.label, 'macOS')
        shell: bash
        run: |
          if ! brew list --versions openssl@3 >/dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install openssl@3
          fi
          prefix="$(brew --prefix openssl@3)"
          if [ ! -x "$prefix/bin/openssl" ]; then
            echo "OpenSSL executable missing at $prefix/bin/openssl" >&2
            exit 1
          fi
          if [ ! -f "$prefix/include/openssl/ssl.h" ]; then
            echo "OpenSSL headers missing under $prefix/include/openssl" >&2
            exit 1
          fi
          architectures="$(lipo -archs "$prefix/lib/libssl.dylib")"
          expected_arch=x86_64
          if [ "$DD_EXPECTED_ARCH" = arm64 ]; then
            expected_arch=arm64
          fi
          if ! grep -Eq "(^|[[:space:]])${expected_arch}([[:space:]]|$)" <<< "$architectures"; then
            echo "Homebrew OpenSSL libssl lacks $expected_arch (reported architectures: $architectures)" >&2
            exit 1
          fi
          echo "Using OpenSSL prefix: $prefix"
          "$prefix/bin/openssl" version
          echo "OPENSSL_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Install macOS Net::SSLeay with diagnostics
        if: startsWith(matrix.label, 'macOS')
        run: cpanm --verbose --notest -L local Net::SSLeay

      - name: Install project dependencies
        run: cpanm --installdeps --notest -L local .

      - name: Install optional macOS filesystem watcher backend
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cpanm -L local Mac::FSEvents
          fi

      - name: Build the Dashboard XS extension (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export PERL5LIB="$GITHUB_WORKSPACE/local/lib/perl5${PERL5LIB:+:$PERL5LIB}"
          perl Makefile.PL
          make

      - name: Build the Dashboard XS extension (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $localLib = Join-Path $env:GITHUB_WORKSPACE 'local/lib/perl5'
          $pathSep = & perl -MConfig -e 'print $Config{path_sep}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:PERL5LIB) {
            $env:PERL5LIB = "$localLib$pathSep$env:PERL5LIB"
          } else {
            $env:PERL5LIB = $localLib
          }
          perl Makefile.PL
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install test tools and export project environment (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cpanm --notest -L local Devel::Cover
          local_lib="$GITHUB_WORKSPACE/local/lib/perl5"
          if [ ! -d "$local_lib" ]; then
            echo "dependency tree missing at $local_lib" >&2
            exit 1
          fi
          perl5lib="$(perl -MConfig -e 'print join $Config{path_sep}, @ARGV' \
            "$GITHUB_WORKSPACE/blib/arch" "$GITHUB_WORKSPACE/blib/lib" \
            "$local_lib" "$local_lib/$(perl -MConfig -e 'print $Config{archname}')")"
          PERL5LIB="$perl5lib${PERL5LIB:+:$PERL5LIB}" perl -MDevel::Cover::DB::IO -e 'print "Devel::Cover serializer available\n"'
          echo "PERL5LIB=$perl5lib" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/local/bin" >> "$GITHUB_PATH"

      - name: Install test tools and export project environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host 'Windows compatibility jobs run the full suite without coverage instrumentation; coverage is enforced by the dedicated Coverage workflow.'
          cpanm --notest -L local Test::Harness~3.48
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $localLib = Join-Path $env:GITHUB_WORKSPACE 'local/lib/perl5'
          if (-not (Test-Path $localLib -PathType Container)) {
            throw "dependency tree missing at $localLib"
          }
          $arch = & perl -MConfig -e 'print $Config{archname}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pathSep = & perl -MConfig -e 'print $Config{path_sep}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $perlPaths = @(
            (Join-Path $env:GITHUB_WORKSPACE 'blib/arch'),
            (Join-Path $env:GITHUB_WORKSPACE 'blib/lib'),
            $localLib,
            (Join-Path $localLib $arch)
          )
          if ($env:PERL5LIB) {
            $perlPaths += $env:PERL5LIB -split [regex]::Escape($pathSep)
          }
          $perl5lib = $perlPaths -join $pathSep
          $env:PERL5LIB = $perl5lib
          & perl -MTAP::Harness::Env -e 'print "TAP::Harness::Env available`n"'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PERL5LIB=$perl5lib" >> $env:GITHUB_ENV
          "$env:GITHUB_WORKSPACE/local/bin" >> $env:GITHUB_PATH

      - name: Benchmark automatic config snapshot path
        run: perl script/problem48-status-route-benchmark --indicators 50 --iterations 100 --runs 7

      - name: Benchmark portable config snapshot path
        run: perl script/problem48-status-route-benchmark --indicators 50 --iterations 100 --runs 7 --portable-config-cache

      - name: Run complete test suite (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            prove -Iblib/arch -Iblib/lib -lrv t
          else
            prove -Iblib/arch -Iblib/lib -lr t
          fi

      - name: Run complete test suite (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: perl -MApp::Prove -e '$app = App::Prove->new; $app->process_args(@ARGV); exit $app->run' -- -Iblib/arch -Iblib/lib -lr t

      - name: Audit action pin provenance
        if: matrix.label == 'Linux x64'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PERL5LIB: ${{ github.workspace }}/local/lib/perl5
        run: script/audit-action-pins

      - name: Install the audit tool outside the scanned root
        if: matrix.label == 'Linux x64'
        shell: bash
        run: |
          cpanm --notest -L audit-local CPAN::Audit
          echo "$GITHUB_WORKSPACE/audit-local/bin" >> "$GITHUB_PATH"

      - name: Audit isolated dependency root (RELEASE GATE)
        if: matrix.label == 'Linux x64'
        env:
          PERL5LIB: ${{ github.workspace }}/audit-local/lib/perl5
        run: script/cpan-audit-project local/lib/perl5

      - name: Audit declared dependency chain (RELEASE GATE)
        if: matrix.label == 'Linux x64'
        env:
          PERL5LIB: ${{ github.workspace }}/audit-local/lib/perl5:${{ github.workspace }}/local/lib/perl5
        run: script/cpan-audit-declared-chain local/lib/perl5
