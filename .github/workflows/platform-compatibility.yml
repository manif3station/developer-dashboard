name: Platform compatibility

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: platform-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perl-tests:
    name: Perl tests (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-latest
            expected-os: linux
            expected-arch: x64
            setup-perl: true
          - label: Linux arm64
            runner: ubuntu-24.04-arm
            expected-os: linux
            expected-arch: arm64
            setup-perl: true
          - label: macOS Intel x64
            runner: macos-26-intel
            expected-os: darwin
            expected-arch: x64
            setup-perl: true
          - label: macOS arm64
            runner: macos-26
            expected-os: darwin
            expected-arch: arm64
            setup-perl: true
          - label: Windows x64
            runner: windows-latest
            expected-os: MSWin32
            expected-arch: x64
            setup-perl: true
    env:
      DD_EXPECTED_OS: ${{ matrix.expected-os }}
      DD_EXPECTED_ARCH: ${{ matrix.expected-arch }}
      PERL_MM_USE_DEFAULT: 1
      NONINTERACTIVE_TESTING: 1
      PERL_EXTUTILS_AUTOINSTALL: --defaultdeps
      DD_REQUIRE_NATIVE_WATCHER: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Perl
        if: matrix.setup-perl
        uses: shogo82148/actions-setup-perl@53e33bb27be492a926eee378e8a5f7ff6618b061  # v1.43.1
        with:
          perl-version: '5.44'

      - name: Report Perl and operating-system architecture
        run: perl -V

      - name: Assert runner operating system and architecture
        run: >-
          perl -MConfig -MPOSIX -e '$os = $^O; $machine = $os eq "MSWin32" ? $ENV{PROCESSOR_ARCHITECTURE} : (POSIX::uname())[4]; $machine = lc $machine; $actual_arch = $machine =~ /(?:aarch64|arm64)/ ? "arm64" : $machine =~ /(?:x86_64|amd64|x64)/ ? "x64" : "unknown"; die "Expected $ENV{DD_EXPECTED_OS}/$ENV{DD_EXPECTED_ARCH}, got $os/$actual_arch ($machine)\n" if $os ne $ENV{DD_EXPECTED_OS} || $actual_arch ne $ENV{DD_EXPECTED_ARCH}; print "Verified $os/$actual_arch ($Config{archname})\n"'

      - name: Prepare Homebrew OpenSSL 3 for macOS
        if: startsWith(matrix.label, 'macOS')
        shell: bash
        run: |
          if ! brew list --versions openssl@3 >/dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install openssl@3
          fi
          prefix="$(brew --prefix openssl@3)"
          if [ ! -x "$prefix/bin/openssl" ]; then
            echo "OpenSSL executable missing at $prefix/bin/openssl" >&2
            exit 1
          fi
          if [ ! -f "$prefix/include/openssl/ssl.h" ]; then
            echo "OpenSSL headers missing under $prefix/include/openssl" >&2
            exit 1
          fi
          architectures="$(lipo -archs "$prefix/lib/libssl.dylib")"
          expected_arch=x86_64
          if [ "$DD_EXPECTED_ARCH" = arm64 ]; then
            expected_arch=arm64
          fi
          if ! grep -Eq "(^|[[:space:]])${expected_arch}([[:space:]]|$)" <<< "$architectures"; then
            echo "Homebrew OpenSSL libssl lacks $expected_arch (reported architectures: $architectures)" >&2
            exit 1
          fi
          echo "Using OpenSSL prefix: $prefix"
          "$prefix/bin/openssl" version
          echo "OPENSSL_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Install macOS Net::SSLeay with diagnostics
        if: startsWith(matrix.label, 'macOS')
        run: cpanm --verbose --notest -L local Net::SSLeay

      - name: Install project dependencies
        run: cpanm --installdeps --notest -L local .

      - name: Install optional macOS filesystem watcher backend
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cpanm -L local Mac::FSEvents
          fi

      - name: Build the Dashboard XS extension (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          perl Makefile.PL
          make

      - name: Build the Dashboard XS extension (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          perl Makefile.PL
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install test tools and export project environment (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cpanm --notest -L local Devel::Cover
          local_lib="$GITHUB_WORKSPACE/local/lib/perl5"
          if [ ! -d "$local_lib" ]; then
            echo "dependency tree missing at $local_lib" >&2
            exit 1
          fi
          perl5lib="$(perl -MConfig -e 'print join $Config{path_sep}, @ARGV' \
            "$GITHUB_WORKSPACE/blib/arch" "$GITHUB_WORKSPACE/blib/lib" \
            "$local_lib" "$local_lib/$(perl -MConfig -e 'print $Config{archname}')")"
          PERL5LIB="$perl5lib${PERL5LIB:+:$PERL5LIB}" perl -MDevel::Cover::DB::IO -e 'print "Devel::Cover serializer available\n"'
          echo "PERL5LIB=$perl5lib" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/local/bin" >> "$GITHUB_PATH"

      - name: Install test tools and export project environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host 'The Windows compatibility job runs the full suite without coverage instrumentation; all-metric coverage is enforced by the Linux Test workflow.'
          $localLib = Join-Path $env:GITHUB_WORKSPACE 'local/lib/perl5'
          if (-not (Test-Path $localLib -PathType Container)) {
            throw "dependency tree missing at $localLib"
          }
          $arch = & perl -MConfig -e 'print $Config{archname}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pathSep = & perl -MConfig -e 'print $Config{path_sep}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $perlPaths = @(
            (Join-Path $env:GITHUB_WORKSPACE 'blib/arch'),
            (Join-Path $env:GITHUB_WORKSPACE 'blib/lib'),
            $localLib,
            (Join-Path $localLib $arch)
          )
          if ($env:PERL5LIB) {
            $perlPaths += $env:PERL5LIB -split [regex]::Escape($pathSep)
          }
          $perl5lib = $perlPaths -join $pathSep
          "PERL5LIB=$perl5lib" >> $env:GITHUB_ENV
          "$env:GITHUB_WORKSPACE/local/bin" >> $env:GITHUB_PATH

      - name: Benchmark automatic config snapshot path
        run: perl script/problem48-status-route-benchmark --indicators 50 --iterations 100 --runs 7

      - name: Benchmark portable config snapshot path
        run: perl script/problem48-status-route-benchmark --indicators 50 --iterations 100 --runs 7 --portable-config-cache

      - name: Run complete test suite
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            prove -Iblib/arch -Iblib/lib -lrv t
          else
            prove -Iblib/arch -Iblib/lib -lr t
          fi

  windows-arm64-native-watcher:
    name: Windows ARM64 native watcher availability
    runs-on: windows-11-arm
    timeout-minutes: 45
    env:
      PERL_MM_USE_DEFAULT: 1
      NONINTERACTIVE_TESTING: 1
      DD_REQUIRE_NATIVE_WATCHER: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Verify Windows ARM64 runner and report its Perl runtime
        id: arm64-perl
        shell: pwsh
        run: |
          perl -V
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') {
            throw "Expected Windows ARM64 runner, got $env:PROCESSOR_ARCHITECTURE"
          }
          $arch = & perl -MConfig -e 'print $Config{archname}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($arch -notmatch 'arm64') {
            Write-Host "::warning title=Native ARM64 Perl unavailable::The hosted runner is ARM64, but its Perl runtime is $arch; native XS watcher steps are skipped."
            "native_perl=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Verified native ARM64 Perl: $arch"
            "native_perl=true" >> $env:GITHUB_OUTPUT
          }

      - name: Install cpanminus
        if: steps.arm64-perl.outputs.native_perl == 'true'
        shell: pwsh
        run: cpan App::cpanminus

      - name: Install project dependencies
        if: steps.arm64-perl.outputs.native_perl == 'true'
        shell: pwsh
        run: cpanm --installdeps --notest -L local .

      - name: Build the Dashboard XS extension (Windows)
        if: steps.arm64-perl.outputs.native_perl == 'true'
        shell: pwsh
        run: |
          perl Makefile.PL
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Windows ARM64 native filesystem watcher test
        if: steps.arm64-perl.outputs.native_perl == 'true'
        env:
          PERL5LIB: ${{ github.workspace }}/local/lib/perl5
        run: prove -Iblib/arch -Iblib/lib -Ilib -lv t/669-problem48-inotify-watch.t
