name: Five-platform 100% Test Coverage

# Default serial fail-fast chain: macOS arm64 -> Linux amd64 -> Linux arm64
# -> Windows amd64 -> Windows arm64. Real Git tags pointing at the latest
# source commit select any subset. Unselected stages do not block later selected
# stages; failed selected stages do. Untagged commits always run all five.
on:
  push:
    branches:
      - master
    # A tag push can start targeted CI without requiring a branch push.
    tags:
      - mac
      - ubuntu-amd64
      - ubuntu-arm64
      - win-amd64
      - win-arm64
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Deduplicate pushes of several platform tags pointing at the same commit.
  group: five-platform-coverage-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  select-platforms:
    name: Select platforms from Git tags on latest commit
    if: ${{ github.repository == 'manif3station/developer-dashboard' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mac: ${{ steps.select.outputs.mac }}
      ubuntu_amd64: ${{ steps.select.outputs.ubuntu_amd64 }}
      ubuntu_arm64: ${{ steps.select.outputs.ubuntu_arm64 }}
      win_amd64: ${{ steps.select.outputs.win_amd64 }}
      win_arm64: ${{ steps.select.outputs.win_arm64 }}
    steps:
      - name: Checkout latest source commit for tag selection
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          # PR: use the actual latest source commit, not the synthetic merge.
          # Push/dispatch: use the triggering commit (branch or Git tag).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Fetch tag refs even when the workflow is triggered by a PR.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Read Git tags pointing at last commit
        id: select
        timeout-minutes: 2
        shell: bash
        run: |
          # Git tag names are refs, not strings in a commit message.
          # Only tags whose peeled target is the checked-out HEAD are selected.
          git tag --points-at HEAD > "$RUNNER_TEMP/dd-platform-git-tags" \
            || { echo "::error::git tag --points-at HEAD failed"; exit 1; }
          # Publish outputs only after parsing succeeds; fail closed otherwise.
          if ! perl script/select-ci-platforms "$RUNNER_TEMP/dd-platform-git-tags" > "$RUNNER_TEMP/dd-platform-outputs"; then
            echo "::error::Platform selection failed; fix the commit tags"
            exit 1
          fi
          cat "$RUNNER_TEMP/dd-platform-outputs" >> "$GITHUB_OUTPUT"

  macos-arm64:
    name: Four-metric coverage 100% (macOS arm64, prove -j 10)
    needs: select-platforms
    if: ${{ !cancelled() && !failure() && github.repository == 'manif3station/developer-dashboard' && needs.select-platforms.result == 'success' && needs.select-platforms.outputs.mac == 'true' }}
    runs-on: macos-15
    timeout-minutes: 270
    env:
      PERL_MM_USE_DEFAULT: '1'
      NONINTERACTIVE_TESTING: '1'
      PERL_EXTUTILS_AUTOINSTALL: --defaultdeps
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify Apple Silicon runner
        timeout-minutes: 5
        shell: bash
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64

      - name: Use unaliased temporary directory
        timeout-minutes: 2
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/perl-test-tmp"
          echo "TMPDIR=$RUNNER_TEMP/perl-test-tmp" >> "$GITHUB_ENV"

      - name: Install native build dependencies
        timeout-minutes: 20
        shell: bash
        run: |
          brew install coreutils expat openssl@3 pkgconf
          echo "CPATH=$(brew --prefix expat)/include:$(brew --prefix openssl@3)/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix expat)/lib:$(brew --prefix openssl@3)/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix expat)/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "OPENSSL_PREFIX=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Set up Perl
        timeout-minutes: 15
        uses: shogo82148/actions-setup-perl@53e33bb27be492a926eee378e8a5f7ff6618b061 # v1.43.1
        with:
          perl-version: '5.44'
          multi-thread: true

      - name: Set up Node for test suite
        timeout-minutes: 10
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install Perl dependencies
        shell: bash
        timeout-minutes: 30
        run: cpanm --installdeps --notest -L local .

      - name: Install Test::Harness and Devel::Cover
        timeout-minutes: 35
        shell: bash
        run: |
          # Align the parallel TAP harness with the Linux and Windows gates.
          cpanm --notest -L local 'Test::Harness~3.48'
          cpanm --notest -L local Devel::Cover

      - name: Build native XS extension
        timeout-minutes: 15
        shell: bash
        run: |
          export PERL5LIB="$GITHUB_WORKSPACE/local/lib/perl5${PERL5LIB:+:$PERL5LIB}"
          perl Makefile.PL
          make

      - name: Require 100% four-metric coverage (10 workers)
        shell: bash
        timeout-minutes: 105
        run: |
          local_lib="$GITHUB_WORKSPACE/local/lib/perl5"
          arch="$(perl -MConfig -e 'print $Config{archname}')"
          # Instrument lib/, never the copied blib/lib source.
          export PERL5LIB="$GITHUB_WORKSPACE/blib/arch:$local_lib:$local_lib/$arch${PERL5LIB:+:$PERL5LIB}"
          export PATH="$GITHUB_WORKSPACE/local/bin:$PATH"
          # Ensure nested Bash shells use the Perl used to build XS.
          perl_bin="$(dirname "$(command -v perl)")"
          printf 'export PATH=%s:$PATH\n' "$(printf '%q' "$perl_bin")" > "$RUNNER_TEMP/perl-ci-bashenv"
          export BASH_ENV="$RUNNER_TEMP/perl-ci-bashenv"
          # script/coverage-gate runs the full suite via prove -j 10,
          # then requires 100% statement, branch, condition and subroutine.
          gtimeout --signal=TERM --kill-after=30s 5400s perl script/coverage-gate --jobs 10

  linux-amd64:
    name: Linux amd64 100% coverage (selected after macOS)
    needs: [select-platforms, macos-arm64]
    if: ${{ !cancelled() && !failure() && github.repository == 'manif3station/developer-dashboard' && needs.select-platforms.result == 'success' && needs.select-platforms.outputs.ubuntu_amd64 == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/linux-coverage.yml
    with:
      target: amd64

  linux-arm64:
    name: Linux arm64 100% coverage (selected after Linux amd64)
    needs: [select-platforms, linux-amd64]
    if: ${{ !cancelled() && !failure() && github.repository == 'manif3station/developer-dashboard' && needs.select-platforms.result == 'success' && needs.select-platforms.outputs.ubuntu_arm64 == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/linux-coverage.yml
    with:
      target: arm64

  windows-amd64:
    name: Windows amd64 100% coverage (selected after Linux arm64)
    needs: [select-platforms, linux-arm64]
    if: ${{ !cancelled() && !failure() && github.repository == 'manif3station/developer-dashboard' && needs.select-platforms.result == 'success' && needs.select-platforms.outputs.win_amd64 == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/windows-amd64-unit-tests.yml

  windows-arm64:
    name: Windows arm64 100% coverage (selected after Windows amd64)
    needs: [select-platforms, windows-amd64]
    if: ${{ !cancelled() && !failure() && github.repository == 'manif3station/developer-dashboard' && needs.select-platforms.result == 'success' && needs.select-platforms.outputs.win_arm64 == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/windows-arm64-coverage.yml
