name: Unit Tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Perl unit tests (prove -j 10)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PERL_MM_USE_DEFAULT: '1'
      NONINTERACTIVE_TESTING: '1'
      PERL_EXTUTILS_AUTOINSTALL: --defaultdeps
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libayatana-appindicator3-dev libgtk-3-dev pkg-config

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@53e33bb27be492a926eee378e8a5f7ff6618b061 # v1.43.1
        with:
          perl-version: '5.44'
          multi-thread: true

      - name: Set up Node for test suite
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install Perl dependencies
        run: cpanm --installdeps --notest -L local .

      - name: Build native XS extension
        shell: bash
        run: |
          export PERL5LIB="$GITHUB_WORKSPACE/local/lib/perl5${PERL5LIB:+:$PERL5LIB}"
          perl Makefile.PL
          make

      - name: Run all unit tests (10 parallel workers)
        shell: bash
        run: |
          local_lib="$GITHUB_WORKSPACE/local/lib/perl5"
          arch="$(perl -MConfig -e 'print $Config{archname}')"
          export PERL5LIB="$GITHUB_WORKSPACE/blib/arch:$GITHUB_WORKSPACE/blib/lib:$local_lib:$local_lib/$arch${PERL5LIB:+:$PERL5LIB}"
          # Bound intermittent hangs while retaining ten TAP workers.
          # --timer reports per-test durations for diagnosis on failure.
          timeout --signal=TERM --kill-after=30s 900s prove -j 10 --timer \
            --rules='seq=t/05-cli-smoke.t' \
            --rules='seq=t/09-runtime-manager.t' \
            --rules='seq=t/15-release-metadata.t' \
            --rules='seq=t/148-coverage-gate-entrypoint.t' \
            --rules='seq=t/149-coverage-gate-moving-target.t' \
            --rules='par=**' \
            -Iblib/arch -Iblib/lib -lr t

  coverage-pr:
    name: Four-metric coverage after Linux
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    needs: unit-tests
    permissions:
      contents: read
    uses: ./.github/workflows/test-coverage.yml

  macos-arm64-pr:
    name: macOS arm64 tests after coverage
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    needs: coverage-pr
    permissions:
      contents: read
    uses: ./.github/workflows/macos-arm64-unit-tests.yml

  windows-amd64-pr:
    name: Windows amd64 tests after macOS
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    needs: macos-arm64-pr
    permissions:
      contents: read
    uses: ./.github/workflows/windows-amd64-unit-tests.yml
