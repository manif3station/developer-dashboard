name: One-shot Linux amd64 Git tag dispatch

on:
  push:
    branches:
      - ci/one-shot-ubuntu-amd64-20261108

permissions:
  contents: write
  actions: write

jobs:
  tag-and-dispatch:
    if: github.repository == 'manif3station/developer-dashboard'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact test fix commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 4d1c4a8b4f3000505723103e80298091d03ac284
          persist-credentials: false
      - name: Run focused tmux shell regression before expensive coverage
        shell: bash
        run: |
          set -euo pipefail
          if ! perl -MCapture::Tiny -e 1 >/dev/null 2>&1 || ! command -v zsh >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y libcapture-tiny-perl zsh
          fi
          prove -lv t/224-tmux-status-format-zsh-glob-quoting.t
      - name: Retarget only ubuntu-amd64 and dispatch existing coverage workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 4d1c4a8b4f3000505723103e80298091d03ac284
          PREVIOUS_TAG_SHA: 267b17f4c3690057a897fea93a6bb2dca8cfb7b0
        run: |
          set -euo pipefail
          # The tag must point at this exact pushed fix branch, not stale master.
          actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/fix/linux-amd64-runtime-tests-20261108" --jq '.object.sha')"
          if [[ "$actual" != "$TARGET_SHA" ]]; then
            echo "::error::Fix branch moved from $TARGET_SHA to $actual; refusing stale test."
            exit 1
          fi
          for tag in mac ubuntu-arm64 win-amd64 win-arm64; do
            other="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null || true)"
            if [[ "$other" == "$TARGET_SHA" ]]; then
              echo "::error::Other platform tag $tag also points at the target commit."
              exit 1
            fi
          done
          existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/ubuntu-amd64" --jq '.object.sha')"
          if [[ "$existing" != "$PREVIOUS_TAG_SHA" && "$existing" != "$TARGET_SHA" ]]; then
            echo "::error::ubuntu-amd64 moved unexpectedly: $existing; refusing to overwrite."
            exit 1
          fi
          if [[ "$existing" == "$PREVIOUS_TAG_SHA" ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/ubuntu-amd64" -f sha="$TARGET_SHA" -F force=true >/dev/null
          fi
          confirmed="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/ubuntu-amd64" --jq '.object.sha')"
          if [[ "$confirmed" != "$TARGET_SHA" ]]; then
            echo "::error::Failed to retarget ubuntu-amd64 to $TARGET_SHA"
            exit 1
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/five-platform-coverage.yml/dispatches" -f ref=ubuntu-amd64 >/dev/null
          echo "::notice::Dispatched Linux-only coverage at $TARGET_SHA"
