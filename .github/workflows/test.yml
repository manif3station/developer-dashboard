name: Test

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PERL_MM_USE_DEFAULT: 1
      NONINTERACTIVE_TESTING: 1
      PERL_EXTUTILS_AUTOINSTALL: --defaultdeps
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@53e33bb27be492a926eee378e8a5f7ff6618b061  # v1.43.1
        with:
          perl-version: '5.44'

      - name: Install project dependencies
        run: cpanm --installdeps --notest -L local .

      # Resolves every action pin above against its upstream tag and reads the
      # runtime the pinned commit really declares. The version comment beside a
      # 40-hex SHA is the only human-readable part of a pin and the guardrail
      # test reads its node24 floors from it, so it has to be verified by
      # something rather than trusted. Runs after the dependency install because
      # it uses the project's own LWP::UserAgent and JSON::XS.
      - name: Audit action pin provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PERL5LIB: ${{ github.workspace }}/local/lib/perl5
        run: script/audit-action-pins

      - name: Install the audit tool outside the scanned root
        run: |
          cpanm --notest -L audit-local CPAN::Audit
          echo "$GITHUB_WORKSPACE/audit-local/bin" >> "$GITHUB_PATH"

      - name: Audit isolated Perl dependencies
        env:
          PERL5LIB: ${{ github.workspace }}/audit-local/lib/perl5
        run: script/cpan-audit-project local/lib/perl5

      - name: Audit the declared dependency chain
        env:
          PERL5LIB: ${{ github.workspace }}/audit-local/lib/perl5:${{ github.workspace }}/local/lib/perl5
        run: script/cpan-audit-declared-chain local/lib/perl5

      - name: Install test tools and export project environment
        run: |
          cpanm --notest -L local Devel::Cover
          # Set the library path directly. This used to shell out to
          # `perl -Mlocal::lib`, which is not installed in this job, so the inner
          # perl died -- and because that death happened inside a command
          # substitution, its status was discarded and the enclosing echo
          # succeeded. The step reported success while exporting an EMPTY
          # PERL5LIB, and the next step failed with nineteen "cannot load module"
          # errors that named nothing. local::lib was never needed: prove only
          # needs PERL5LIB, and the path is known.
          perl5lib="$GITHUB_WORKSPACE/local/lib/perl5"
          if [ ! -d "$perl5lib" ]; then
            echo "dependency tree missing at $perl5lib - cpanm --installdeps did not populate it" >&2
            exit 1
          fi
          echo "PERL5LIB=$perl5lib" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/local/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: |
          # The job has died inside this step with no conclusion and no uploaded
          # log at all, while every other workflow on the same commit passed
          # (DD-484). "No log" is not "no output" - it means the runner itself
          # stopped - so this samples the machine every ten seconds and prints
          # it inline. Whatever exhausts the runner (process growth, memory,
          # disk) is then visible in the streamed log even if the job never
          # finishes to upload anything.
          (
            while true; do
              printf '[watch] %s procs=%s load=%s mem=%s disk=%s\n' \
                "$(date -u +%H:%M:%S)" \
                "$(ps -e --no-headers | wc -l)" \
                "$(cut -d' ' -f1-3 /proc/loadavg)" \
                "$(free -m | awk '/Mem:/{print $3"/"$2"MB"}')" \
                "$(df -Pm . | awk 'NR==2{print $4"MB free"}')"
              sleep 10
            done
          ) &
          watcher=$!
          trap 'kill "$watcher" 2>/dev/null || true' EXIT
          prove -lr t

      - name: Verify all-metric lib coverage
        run: |
          cover -delete
          HARNESS_PERL_SWITCHES='-MDevel::Cover=-blib,0' prove -lr t
          cover -report text -select_re '^lib/' -coverage statement -coverage branch -coverage condition -coverage subroutine \
            | perl script/check-all-metric-coverage
