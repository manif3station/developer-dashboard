name: macOS arm64 Unit Tests

# PRs call this workflow after both Linux and coverage pass.
# Master runs follow a successful coverage workflow.
on:
  workflow_call:
  workflow_run:
    workflows:
      - Test Coverage
    branches:
      - master
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: macos-arm64-unit-tests-${{ github.event_name }}-${{ github.event.workflow_run.head_branch || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    name: Perl unit tests (macOS arm64, prove -j 10)
    if: ${{ github.repository == 'manif3station/developer-dashboard' && ((github.event_name != 'workflow_run' && startsWith(github.workflow_ref, 'manif3station/developer-dashboard/.github/workflows/unit-tests.yml@')) || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: macos-15
    timeout-minutes: 180
    env:
      PERL_MM_USE_DEFAULT: '1'
      NONINTERACTIVE_TESTING: '1'
      PERL_EXTUTILS_AUTOINSTALL: --defaultdeps
    steps:
      - name: Verify trusted upstream
        if: ${{ github.event_name == 'workflow_run' }}
        timeout-minutes: 2
        shell: bash
        env:
          UPSTREAM_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          test "$UPSTREAM_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$UPSTREAM_EVENT" = workflow_run

      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Verify Apple Silicon runner
        timeout-minutes: 5
        shell: bash
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64

      - name: Use unaliased temporary directory
        timeout-minutes: 2
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/perl-test-tmp"
          echo "TMPDIR=$RUNNER_TEMP/perl-test-tmp" >> "$GITHUB_ENV"

      - name: Install native build dependencies
        timeout-minutes: 20
        shell: bash
        run: |
          brew install coreutils expat openssl@3 pkgconf
          echo "CPATH=$(brew --prefix expat)/include:$(brew --prefix openssl@3)/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix expat)/lib:$(brew --prefix openssl@3)/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix expat)/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "OPENSSL_PREFIX=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Set up Perl
        timeout-minutes: 15
        uses: shogo82148/actions-setup-perl@53e33bb27be492a926eee378e8a5f7ff6618b061 # v1.43.1
        with:
          perl-version: '5.44'
          multi-thread: true

      - name: Set up Node for test suite
        timeout-minutes: 10
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install Perl dependencies
        shell: bash
        timeout-minutes: 30
        run: cpanm --installdeps --notest -L local .

      - name: Build native XS extension
        timeout-minutes: 15
        shell: bash
        run: |
          export PERL5LIB="$GITHUB_WORKSPACE/local/lib/perl5${PERL5LIB:+:$PERL5LIB}"
          perl Makefile.PL
          make

      - name: Run all unit tests (10 parallel workers)
        shell: bash
        timeout-minutes: 45
        run: |
          local_lib="$GITHUB_WORKSPACE/local/lib/perl5"
          arch="$(perl -MConfig -e 'print $Config{archname}')"
          export PERL5LIB="$GITHUB_WORKSPACE/blib/arch:$GITHUB_WORKSPACE/blib/lib:$local_lib:$local_lib/$arch${PERL5LIB:+:$PERL5LIB}"
          # Nested login shells must use the Perl that compiled the native XS.
          perl_bin="$(dirname "$(command -v perl)")"
          printf 'export PATH=%s:$PATH\n' "$(printf '%q' "$perl_bin")" > "$RUNNER_TEMP/perl-ci-bashenv"
          export BASH_ENV="$RUNNER_TEMP/perl-ci-bashenv"
          # t/03-web-app.t is serialised only on macOS: portable config
          # and cache assertions can race with concurrent filesystem changes.
          gtimeout --signal=TERM --kill-after=30s 900s prove -j 10 --timer \
            --rules='seq=t/03-web-app.t' \
            --rules='seq=t/148-coverage-gate-entrypoint.t' \
            --rules='seq=t/05-cli-smoke.t' \
            --rules='seq=t/09-runtime-manager.t' \
            --rules='seq=t/15-release-metadata.t' \
            --rules='par=**' \
            -Iblib/arch -Iblib/lib -lr t
