name: macOS arm64 Unit Tests

# Only start after the existing Linux Unit Tests workflow has finished.
# Coverage remains independent and keeps its own workflow_run dependency.
on:
  workflow_run:
    workflows:
      - Unit Tests
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: macos-arm64-unit-tests-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    name: Perl unit tests (macOS arm64, prove -j 10)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: macos-15
    timeout-minutes: 180
    env:
      PERL_MM_USE_DEFAULT: '1'
      NONINTERACTIVE_TESTING: '1'
      PERL_EXTUTILS_AUTOINSTALL: --defaultdeps
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify Apple Silicon runner
        timeout-minutes: 5
        shell: bash
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64

      - name: Install native build dependencies
        timeout-minutes: 20
        shell: bash
        run: |
          brew install expat openssl@3 pkgconf
          echo "CPATH=$(brew --prefix expat)/include:$(brew --prefix openssl@3)/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix expat)/lib:$(brew --prefix openssl@3)/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix expat)/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "OPENSSL_PREFIX=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Set up Perl
        timeout-minutes: 15
        uses: shogo82148/actions-setup-perl@53e33bb27be492a926eee378e8a5f7ff6618b061 # v1.43.1
        with:
          perl-version: '5.44'
          multi-thread: true

      - name: Set up Node for test suite
        timeout-minutes: 10
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install Perl dependencies
        shell: bash
        timeout-minutes: 30
        run: cpanm --installdeps --notest -L local .

      - name: Build native XS extension
        timeout-minutes: 15
        shell: bash
        run: |
          export PERL5LIB="$GITHUB_WORKSPACE/local/lib/perl5${PERL5LIB:+:$PERL5LIB}"
          perl Makefile.PL
          make

      - name: Run all unit tests (10 parallel workers)
        shell: bash
        timeout-minutes: 45
        run: |
          local_lib="$GITHUB_WORKSPACE/local/lib/perl5"
          arch="$(perl -MConfig -e 'print $Config{archname}')"
          export PERL5LIB="$GITHUB_WORKSPACE/blib/arch:$GITHUB_WORKSPACE/blib/lib:$local_lib:$local_lib/$arch${PERL5LIB:+:$PERL5LIB}"
          prove -j 10 --timer \
            --rules='seq=t/05-cli-smoke.t' \
            --rules='seq=t/09-runtime-manager.t' \
            --rules='seq=t/15-release-metadata.t' \
            --rules='par=**' \
            -Iblib/arch -Iblib/lib -lr t
