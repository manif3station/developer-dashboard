name: Coverage

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-coverage:
    name: Test coverage 100%
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PERL_MM_USE_DEFAULT: 1
      NONINTERACTIVE_TESTING: 1
      PERL_EXTUTILS_AUTOINSTALL: --defaultdeps
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install native Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libayatana-appindicator3-dev libgtk-3-dev pkg-config

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@53e33bb27be492a926eee378e8a5f7ff6618b061  # v1.43.1
        with:
          perl-version: '5.44'
          multi-thread: true

      - name: Install project dependencies
        run: cpanm --installdeps --notest -L local .

      - name: Build Dashboard XS extension
        shell: bash
        run: |
          export PERL5LIB="$GITHUB_WORKSPACE/local/lib/perl5${PERL5LIB:+:$PERL5LIB}"
          perl Makefile.PL
          make

      - name: Prepare coverage environment
        shell: bash
        run: |
          cpanm --notest -L local Devel::Cover
          local_lib="$GITHUB_WORKSPACE/local/lib/perl5"
          perl5lib="$(perl -MConfig -e 'print join $Config{path_sep}, @ARGV' \
            "$GITHUB_WORKSPACE/blib/arch" "$GITHUB_WORKSPACE/blib/lib" \
            "$local_lib" "$local_lib/$(perl -MConfig -e 'print $Config{archname}')")"
          echo "PERL5LIB=$perl5lib" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/local/bin" >> "$GITHUB_PATH"

      - name: Enforce 100% test coverage
        run: perl script/coverage-gate

  pod-coverage:
    name: POD coverage 100%
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@53e33bb27be492a926eee378e8a5f7ff6618b061  # v1.43.1
        with:
          perl-version: '5.44'
          multi-thread: true

      - name: Enforce 100% POD coverage
        run: perl script/pod-coverage-gate

  markdown-coverage:
    name: Markdown coverage 100%
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@53e33bb27be492a926eee378e8a5f7ff6618b061  # v1.43.1
        with:
          perl-version: '5.44'
          multi-thread: true

      - name: Enforce 100% Markdown coverage
        run: perl script/markdown-coverage-gate
