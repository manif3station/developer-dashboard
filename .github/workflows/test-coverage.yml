name: Test Coverage

on:
  workflow_call:
  workflow_run:
    workflows:
      - Unit Tests
    types:
      - completed
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: test-coverage-${{ github.event.workflow_run.id || github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  coverage:
    name: Four-metric coverage 100% (prove -j 10)
    if: ${{ github.repository == 'manif3station/developer-dashboard' && ((github.event_name != 'workflow_run' && startsWith(github.workflow_ref, 'manif3station/developer-dashboard/.github/workflows/unit-tests.yml@')) || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PERL_MM_USE_DEFAULT: '1'
      NONINTERACTIVE_TESTING: '1'
      PERL_EXTUTILS_AUTOINSTALL: --defaultdeps
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libayatana-appindicator3-dev libgtk-3-dev pkg-config

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@53e33bb27be492a926eee378e8a5f7ff6618b061 # v1.43.1
        with:
          perl-version: '5.44'
          multi-thread: true

      - name: Set up Node for test suite
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install Perl dependencies
        run: cpanm --installdeps --notest -L local .

      - name: Install Devel::Cover
        run: cpanm --notest -L local Devel::Cover

      - name: Build native XS extension
        shell: bash
        run: |
          export PERL5LIB="$GITHUB_WORKSPACE/local/lib/perl5${PERL5LIB:+:$PERL5LIB}"
          perl Makefile.PL
          make

      - name: Require 100% statement, branch, condition, and subroutine coverage
        shell: bash
        run: |
          local_lib="$GITHUB_WORKSPACE/local/lib/perl5"
          arch="$(perl -MConfig -e 'print $Config{archname}')"
          # Instrument source files from lib/ once, not both lib/ and blib/lib/.
          # The compiled XS binary stays reachable through blib/arch.
          export PERL5LIB="$GITHUB_WORKSPACE/blib/arch:$local_lib:$local_lib/$arch${PERL5LIB:+:$PERL5LIB}"
          export PATH="$GITHUB_WORKSPACE/local/bin:$PATH"
          perl script/coverage-gate --jobs 10
