name: Windows amd64 Test Coverage

# Reusable only: macOS coverage calls this after it passes.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  windows-amd64:
    name: Four-metric coverage 100% (Windows amd64, prove -j 10)
    if: ${{ github.repository == 'manif3station/developer-dashboard' && startsWith(github.workflow_ref, 'manif3station/developer-dashboard/.github/workflows/macos-arm64-unit-tests.yml@') }}
    runs-on: windows-latest
    timeout-minutes: 300
    env:
      PERL_MM_USE_DEFAULT: '1'
      NONINTERACTIVE_TESTING: '1'
      PERL_EXTUTILS_AUTOINSTALL: --defaultdeps
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify Windows amd64 runner
        timeout-minutes: 2
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw "Expected Windows/X64, got $env:RUNNER_OS/$env:RUNNER_ARCH"
          }

      - name: Install pinned Strawberry Perl
        timeout-minutes: 20
        shell: pwsh
        run: |
          $version = '5.42.3.1'
          $archive = Join-Path $env:RUNNER_TEMP "strawberry-perl-$version-64bit-portable.zip"
          $root = Join-Path $env:RUNNER_TEMP 'strawberry-perl-portable'
          $url = 'https://github.com/StrawberryPerl/Perl-Dist-Strawberry/releases/download/SP_54231_64bit/strawberry-perl-5.42.3.1-64bit-portable.zip'
          $expectedSha256 = '6a081a811781c30aca51dbc036afd93092af91e3297901f02c17043795a10690'
          Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing
          $actualSha256 = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Strawberry Perl SHA256 mismatch: $actualSha256"
          }
          Expand-Archive -Path $archive -DestinationPath $root -Force
          $siteBin = Join-Path $root 'perl\site\bin'
          $perlBin = Join-Path $root 'perl\bin'
          $compilerBin = Join-Path $root 'c\bin'
          if (-not (Test-Path (Join-Path $perlBin 'perl.exe'))) {
            throw "Missing extracted Perl at $perlBin"
          }
          $env:PATH = "$siteBin;$perlBin;$compilerBin;$env:PATH"
          "$siteBin" >> $env:GITHUB_PATH
          "$perlBin" >> $env:GITHUB_PATH
          "$compilerBin" >> $env:GITHUB_PATH
          perl -e 'die "Perl 5.38 or newer required\n" if $] < 5.038; print "Perl $^V ready\n"'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Do not trust a cpanm command from another Perl installation.
          $cpanm = Get-Command cpanm -ErrorAction SilentlyContinue
          if (-not $cpanm -or -not $cpanm.Source.StartsWith(
              "$root\", [StringComparison]::OrdinalIgnoreCase)) {
            cpan App::cpanminus
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $cpanm = Get-Command cpanm -ErrorAction SilentlyContinue
          if (-not $cpanm -or -not $cpanm.Source.StartsWith(
              "$root\", [StringComparison]::OrdinalIgnoreCase)) {
            $cpanmPath = if ($cpanm) { $cpanm.Source } else { '(not found)' }
            throw "cpanm is not from pinned Strawberry Perl: $cpanmPath"
          }

      - name: Set up Node for test suite
        timeout-minutes: 10
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install Perl dependencies
        timeout-minutes: 45
        shell: pwsh
        run: |
          # Keep the index and archives on the same endpoint. The previous
          # mirror intermittently failed to serve Test::TCP and other Plack
          # prerequisites even when its index listed them. Retry with the
          # official CPAN CDN if MetaCPAN fails, never bypass dependencies.
          $cpanMirrors = @('https://cpan.metacpan.org/', 'https://www.cpan.org/')
          $depsInstalled = $false
          foreach ($mirror in $cpanMirrors) {
            cpanm --from $mirror --installdeps --notest -L local .
            if ($LASTEXITCODE -eq 0) {
              $depsInstalled = $true
              break
            }
            Write-Warning "Dependency install from $mirror failed; retrying another CPAN endpoint"
          }
          if (-not $depsInstalled) { throw 'Perl dependencies failed on all CPAN endpoints' }
          $harnessInstalled = $false
          foreach ($mirror in $cpanMirrors) {
            cpanm --from $mirror --notest -L local Test::Harness~3.48
            if ($LASTEXITCODE -eq 0) {
              $harnessInstalled = $true
              break
            }
          }
          if (-not $harnessInstalled) { throw 'Test::Harness install failed on all CPAN endpoints' }

      - name: Install Devel::Cover (required on Windows)
        timeout-minutes: 40
        shell: pwsh
        run: |
          # No skip or substitute ordinary test run if XS coverage fails.
          $localLib = Join-Path $env:GITHUB_WORKSPACE 'local/lib/perl5'
          $pathSep = & perl -MConfig -e 'print $Config{path_sep}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PERL5LIB = if ($env:PERL5LIB) {
            "$localLib$pathSep$env:PERL5LIB"
          } else {
            $localLib
          }
          $coverInstalled = $false
          foreach ($mirror in @('https://cpan.metacpan.org/', 'https://www.cpan.org/')) {
            cpanm --from $mirror --notest -L local Devel::Cover
            if ($LASTEXITCODE -eq 0) {
              $coverInstalled = $true
              break
            }
          }
          if (-not $coverInstalled) { throw 'Devel::Cover installation failed on all CPAN endpoints' }
          perl -MDevel::Cover::DB::IO -e 'print "Devel::Cover ready\n"'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build native XS extension
        timeout-minutes: 20
        shell: pwsh
        run: |
          $localLib = Join-Path $env:GITHUB_WORKSPACE 'local/lib/perl5'
          $pathSep = & perl -MConfig -e 'print $Config{path_sep}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:PERL5LIB) {
            $env:PERL5LIB = "$localLib$pathSep$env:PERL5LIB"
          } else {
            $env:PERL5LIB = $localLib
          }
          perl Makefile.PL
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Require 100% four-metric coverage (10 workers)
        timeout-minutes: 120
        shell: pwsh
        run: |
          $localLib = Join-Path $env:GITHUB_WORKSPACE 'local/lib/perl5'
          $arch = & perl -MConfig -e 'print $Config{archname}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pathSep = & perl -MConfig -e 'print $Config{path_sep}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Instrument source from lib/, not the copied blib/lib modules.
          $perlPaths = @(
            (Join-Path $env:GITHUB_WORKSPACE 'blib/arch'),
            $localLib,
            (Join-Path $localLib $arch)
          )
          if ($env:PERL5LIB) {
            $perlPaths += $env:PERL5LIB -split [regex]::Escape($pathSep)
          }
          $env:PERL5LIB = $perlPaths -join $pathSep
          $env:PATH = "$env:GITHUB_WORKSPACE/local/bin;$env:PATH"
          # Several integration tests execute POSIX shell recipes and require
          # standard Unix tools. Native Strawberry Perl otherwise dispatches
          # command strings through cmd.exe, which cannot parse those recipes.
          # Git for Windows is installed on GitHub's Windows runner; retain the
          # pinned Strawberry Perl first in PATH to avoid loading Git's Perl.
          $gitUsrBin = Join-Path $env:ProgramFiles 'Git\usr\bin'
          $gitBash = Join-Path $env:ProgramFiles 'Git\bin\bash.exe'
          if (-not (Test-Path $gitBash) -or -not (Test-Path (Join-Path $gitUsrBin 'sh.exe'))) {
            throw 'Git Bash and POSIX utilities required for Windows integration tests'
          }
          $env:PATH = "$env:PATH;$gitUsrBin"
          # perlrun documents PERL5SHELL as whitespace-delimited; escape the
          # space in Program Files and use forward slashes for the executable.
          $escapedBash = $gitBash.Replace('\', '/').Replace(' ', '\ ')
          $env:PERL5SHELL = "$escapedBash -c"
          perl -e 'my $result = qx(printf first | tr a-z A-Z); die "POSIX command shell unavailable: $result\n" unless $result eq "FIRST"; print "POSIX shell ready\n"'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Force the Devel::Cover CLI to use pinned native Strawberry Perl.
          # Otherwise an extensionless local/bin/cover can launch through
          # Git Bash shebang handling and corrupt native PERL5LIB drive paths.
          $coverScript = Join-Path $env:GITHUB_WORKSPACE 'local/bin/cover'
          $env:DD_NATIVE_COVER_SCRIPT = $coverScript
          $nativePerl = (Get-Command perl -ErrorAction Stop).Source
          if (-not (Test-Path $coverScript)) { throw 'Missing installed Devel::Cover script' }
          $coverWrapperDir = Join-Path $env:RUNNER_TEMP 'native-cover-cli'
          New-Item -ItemType Directory -Path $coverWrapperDir -Force | Out-Null
          $coverWrapper = Join-Path $coverWrapperDir 'cover.cmd'
          $wrapperBody = '@echo off' + [Environment]::NewLine + ('"' + $nativePerl + '" "' + $coverScript + '" %*') + [Environment]::NewLine
          Set-Content -Path $coverWrapper -Value $wrapperBody -Encoding ascii -NoNewline
          $env:PATH = "$coverWrapperDir;$env:PATH"
          # Verify the serializer before starting the costly strict suite.
          perl -MJSON -MStorable -MDevel::Cover::DB::IO -e 'print "Native coverage serializer ready\n"'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Native coverage CLI wrapper: $coverWrapper"
          # The gate's Unix default /tmp lock path does not exist on Windows.
          $env:DD_SUITE_LOCK = Join-Path $env:RUNNER_TEMP 'dd-gate-host.lock'
          # Full prove -j 10 suite and all four 100% coverage gates.
          perl script/coverage-gate --jobs 10
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
