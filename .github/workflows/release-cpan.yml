name: Release To CPAN

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-cpan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PAUSE_USER: ${{ secrets.PAUSE_USER }}
      PAUSE_PASS: ${{ secrets.PAUSE_PASS }}
      PERL_MM_USE_DEFAULT: 1
      NONINTERACTIVE_TESTING: 1
      PERL_EXTUTILS_AUTOINSTALL: --defaultdeps
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@53e33bb27be492a926eee378e8a5f7ff6618b061  # v1.43.1
        with:
          perl-version: '5.44'

      - name: Install release dependencies
        run: |
          cpanm --installdeps --notest .
          cpanm --notest Devel::Cover
          cpanm --notest Capture::Tiny
          cpanm --notest Sub::Install Data::OptList Params::Util
          cpanm --notest Sub::Exporter Sub::Exporter::Util
          cpanm --notest Module::Runtime Try::Tiny Module::Implementation
          cpanm --notest Dist::CheckConflicts Package::Stash::XS Package::Stash Class::Load
          cpanm --notest Getopt::Long Getopt::Long::Descriptive
          cpanm --notest IO::TieCombine String::RewritePrefix Module::Pluggable::Object
          cpanm --notest App::Cmd
          cpanm --notest Dist::Zilla
          cpanm --notest Dist::Zilla::Plugin::ManifestSkip
          cpanm --notest Dist::Zilla::Plugin::MetaProvides::Package
          cpanm --notest Dist::Zilla::Plugin::PkgVersion
          cpanm --notest Module::CPANTS::Analyse
          cpanm --notest CPAN::Uploader

      - name: Run tests
        run: |
          prove -lr t

      - name: Verify all-metric lib coverage
        run: |
          # One process runs the whole chain, so the drop, the instrumented
          # suite and the report cannot see different library paths. A split
          # chain lets Devel::Cover write one serialization format and read
          # another, which surfaces as a parse error that reads like a corrupt
          # database (DD-503).
          perl script/coverage-gate

      - name: Build distribution tarball
        run: |
          dzil build

      - name: Verify tarball kwalitee
        run: |
          prove -lv t/36-release-kwalitee.t

      - name: Verify built distribution smoke
        run: |
          dist_dir="$(ls -1dt Developer-Dashboard-* | head -n 1)"
          if [ -z "${dist_dir}" ] || [ ! -d "${dist_dir}" ]; then
            echo "No built distribution directory was created" >&2
            exit 1
          fi
          cd "$dist_dir"
          prove -lv t/13-integration-assets.t t/15-release-metadata.t t/30-dashboard-loader.t t/33-web-server-ssl-browser.t

      - name: Locate distribution artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact="$(ls -1t Developer-Dashboard-*.tar.gz | head -n 1)"
          if [ -z "${artifact}" ]; then
            echo "No distribution tarball was created" >&2
            exit 1
          fi
          echo "artifact=${artifact}" >> "$GITHUB_OUTPUT"

      - name: Upload to PAUSE
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PAUSE_USER:-}" ] || [ -z "${PAUSE_PASS:-}" ]; then
            echo "PAUSE_USER and PAUSE_PASS secrets are required" >&2
            exit 1
          fi
          cpan-upload -u "$PAUSE_USER" -p "$PAUSE_PASS" "${{ steps.artifact.outputs.artifact }}"
