name: JS Fuzz

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PERL_MM_USE_DEFAULT: 1
      NONINTERACTIVE_TESTING: 1
      PERL_EXTUTILS_AUTOINSTALL: --defaultdeps
      # DD-794: the other half of the contained install below. local/lib/perl5 is
      # NOT on @INC, and the fuzz test spawns perl with -Ilib plus the dashboard
      # script - where -Ilib supplies only the project's own lib and none of the
      # dependencies. Set at job level rather than on one step so a later step
      # that runs perl cannot silently miss it. Removing this while leaving -L in
      # place turns a rare upgrade-triggered failure into a permanent one.
      PERL5LIB: ${{ github.workspace }}/local/lib/perl5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@53e33bb27be492a926eee378e8a5f7ff6618b061  # v1.43.1
        with:
          perl-version: '5.44'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: npm

      # CONTAINED DELIBERATELY (DD-794). A bare cpanm --installdeps mutates the
      # perl tree actions-setup-perl shipped with, which is already populated -
      # so a declared version bump becomes an UPGRADE, and cpanm verifies the
      # result against a version scan taken BEFORE it installed anything. Run
      # 34036177297 logged "Successfully installed URI-5.37 (upgraded from 5.35)"
      # and then, one second later, "Installed version (5.35) of URI is not in
      # range '5.36'" - for BOTH URI and URI::Escape, two modules of one
      # distribution, which is what identifies a single stale pre-install scan
      # rather than a second tree. Against a fresh local/ the module is absent,
      # the install is a first install, and there is nothing for that scan to be
      # stale about. See docs/containing-a-ci-dependency-install.md.
      - name: Install Perl dependencies
        run: cpanm --installdeps --notest -L local .

      - name: Install JS test dependencies
        run: npm ci --ignore-scripts

      - name: Run fast-check property tests
        run: npm run fuzz:scorecard
