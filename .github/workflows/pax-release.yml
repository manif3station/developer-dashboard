name: PAX Release

# DD-1012: workflow skeleton + trigger, part of epic DDE-006 (Multi-platform
# PAX CI). Trigger mirrors package-ghcr.yml's established push-to-master
# convention. The matrix defines all 6 owner-confirmed platform/arch targets.
#
# DD-1013 wired the 3 Linux targets to a real `dashboard pax build` +
# native smoke check, mirroring t/182-dashboard-self-compile.t's own
# proven local invocation (no paxfile.yml - the build tool auto-discovers
# dependencies). The macOS/Windows targets (DD-1014/DD-1015) still show the
# placeholder below.
#
# DASHBOARD ONLY FOR NOW, NOT d2: DD-1017 (filed 2026-09-22, linked under
# this same epic) found that bin/d2's re-exec line unconditionally shells
# through perl to invoke its sibling `dashboard`, with no handling for the
# case where that sibling is a COMPILED binary - so a standalone-compiled
# d2 cannot currently exec a standalone-compiled dashboard. d2 will be
# added to this matrix's build step once DD-1017 lands.

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pax-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runs_on: ubuntu-latest
            artifact_name: d2-dashboard-linux-amd64
          - target: linux-arm64
            runs_on: ubuntu-24.04-arm
            artifact_name: d2-dashboard-linux-arm64
          - target: linux-i686
            # No native 32-bit GitHub-hosted runner exists (verified
            # 2026-09-22). Runs on an amd64 host with gcc-multilib and a
            # PATH-wrapped cc forcing -m32 - see the "Install 32-bit
            # toolchain" step below.
            runs_on: ubuntu-latest
            artifact_name: d2-dashboard-linux-i686
          - target: macos-arm64
            runs_on: macos-14
            artifact_name: d2-dashboard-macos-arm64
          - target: windows-amd64
            runs_on: windows-latest
            artifact_name: d2-dashboard-windows-amd64
          - target: windows-arm64
            # GitHub-hosted Windows arm64 runners reached GA 2025-08 (public
            # repos) / 2026-01 (private repos) - verified 2026-09-22. Exact
            # runner label confirmed by DD-1015 when it wires the real
            # build step.
            runs_on: windows-11-arm
            artifact_name: d2-dashboard-windows-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install 32-bit toolchain (linux-i686 only)
        if: matrix.target == 'linux-i686'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib
          # StandaloneImage.pm's _compile_launcher hardcodes
          # `_which('cc') || _which('gcc')` - it never reads $ENV{CC} - so a
          # CC=... override is silently ignored. Put a wrapper named `cc`
          # earlier on PATH that always adds -m32, so the PATH lookup this
          # build resolver already does finds the 32-bit-forcing wrapper.
          # MUST resolve the real cc's absolute path BEFORE prepending the
          # wrapper dir to PATH, and the wrapper must exec that absolute
          # path, not the bare name `cc` - otherwise the wrapper's own
          # `exec cc ...` re-resolves through the same PATH and calls
          # itself, recursing forever (caught locally: an 18+ minute
          # runaway at 96% CPU with zero output before this fix).
          real_cc=$(command -v cc)
          mkdir -p "$RUNNER_TEMP/cc32"
          printf '#!/bin/sh\nexec %s -m32 "$@"\n' "$real_cc" > "$RUNNER_TEMP/cc32/cc"
          chmod +x "$RUNNER_TEMP/cc32/cc"
          echo "$RUNNER_TEMP/cc32" >> "$GITHUB_PATH"

      - name: Setup Perl (Linux only)
        # DD-1018: GitHub-hosted ubuntu-latest/ubuntu-24.04-arm runners do
        # not ship cpanm pre-installed - they are generic runners, not
        # Perl-specific images. Every real CI run of this workflow failed
        # with "cpanm: command not found" until this step was added.
        # Matches test.yml's own established Perl-setup pattern exactly
        # (same pinned SHA, same perl-version).
        if: startsWith(matrix.target, 'linux-')
        uses: shogo82148/actions-setup-perl@53e33bb27be492a926eee378e8a5f7ff6618b061  # v1.43.1
        with:
          perl-version: '5.44'

      - name: Install Perl dependencies (Linux only)
        if: startsWith(matrix.target, 'linux-')
        run: cpanm --quiet --notest --installdeps .

      - name: PAX build dashboard (Linux only)
        if: startsWith(matrix.target, 'linux-')
        run: |
          mkdir -p pax-output
          # DD-1018 (third finding, same investigation): share/private-cli/pax
          # resolves its own lib/ via `use FindBin qw($Bin); use lib
          # "$Bin/../lib";`, which works in every local invocation this
          # project's own tests and sandboxes use - but a real GitHub Actions
          # run of this exact command failed with "Can't locate
          # Developer/Dashboard/Pax/CLI.pm in @INC", even though
          # share/private-cli/../lib WAS listed as a checked @INC entry.
          # Root cause not fully diagnosed (FindBin's $Bin+cwd resolution
          # behaves differently in this CI environment); -Ilib sidesteps it
          # entirely by being explicit rather than relying on inference.
          perl -Ilib share/private-cli/pax build --compact -o pax-output/dashboard bin/dashboard

      - name: PAX build (placeholder, non-Linux)
        if: ${{ !startsWith(matrix.target, 'linux-') }}
        run: echo "TODO (DD-1014/1015) - dashboard pax build for ${{ matrix.target }}"

      - name: Smoke-verify the compiled dashboard binary (Linux only)
        if: startsWith(matrix.target, 'linux-')
        run: |
          set -e
          file pax-output/dashboard
          if [ "${{ matrix.target }}" = "linux-i686" ]; then
            file pax-output/dashboard | grep -q "ELF 32-bit" || { echo "expected a 32-bit ELF binary"; exit 1; }
          fi
          compiled_version=$(./pax-output/dashboard version)
          source_version=$(perl bin/dashboard version)
          if [ "$compiled_version" != "$source_version" ]; then
            echo "compiled binary version ($compiled_version) does not match source-Perl CLI version ($source_version)"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: pax-output/
          if-no-files-found: ignore
